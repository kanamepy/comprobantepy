# Servicios para desarrollo local: PostgreSQL y MinIO (almacenamiento compatible con S3).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: comprobantepy
      POSTGRES_PASSWORD: comprobantepy
      POSTGRES_DB: comprobantepy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: comprobantepy
      MINIO_ROOT_PASSWORD: comprobantepy-secreto
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

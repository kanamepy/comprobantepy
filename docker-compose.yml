# Base de datos PostgreSQL para desarrollo local.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: comprobantepy
      POSTGRES_PASSWORD: comprobantepy
      POSTGRES_DB: comprobantepy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
